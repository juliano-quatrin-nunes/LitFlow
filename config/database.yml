default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5440 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  primary:
    <<: *default
    database: litflow_development
  cache:
    <<: *default
    database: litflow_development
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: litflow_development
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: litflow_development
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: litflow_test
  cache:
    <<: *default
    database: litflow_test
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: litflow_test
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: litflow_test
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: litflow_production
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  cache:
    <<: *default
    database: litflow_production
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: litflow_production
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: litflow_production
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
    migrations_paths: db/cable_migrate
