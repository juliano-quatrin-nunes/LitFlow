name: Breadcrumbs
description: Display navigation breadcrumbs. Renders a list of breadcrumb items with separators.

preview: |
  <%= ui.breadcrumbs do %>
    <%= ui.breadcrumb "Home", url: "/" %>
    <%= ui.breadcrumb "Library", url: "/library" %>
    <%= ui.breadcrumb "Current Page" %>
  <% end %>

usage: |
  <%= ui.breadcrumbs do %>
    <%= ui.breadcrumb "Label", url: path %>
  <% end %>

accepts_html_attributes: true

content:
  description: "One or more ui.breadcrumb components."

props:
  - name: class
    type: String
    default: "nil"
    description: Additional CSS classes.

examples:
  - name: Default
    code: |
      <%= ui.breadcrumbs do %>
        <%= ui.breadcrumb "Home", url: "/" %>
        <%= ui.breadcrumb "Music" %>
      <% end %>

  - name: Long Trail
    code: |
      <%= ui.breadcrumbs do %>
        <%= ui.breadcrumb "Home", url: "/" %>
        <%= ui.breadcrumb "Biblioteca", url: "/repertoire/musics" %>
        <%= ui.breadcrumb "Músicas", url: "/repertoire/musics" %>
        <%= ui.breadcrumb "Aleluia" %>
      <% end %>
